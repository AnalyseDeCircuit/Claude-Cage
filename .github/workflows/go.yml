name: Cage checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cage-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Application version consistency
        run: make check-version
      - name: Build the actual macOS application
        run: make app
      - name: Workbench checks
        run: |
          make test-ui test-guest test-tools
      - name: Go tests and vet
        run: |
          make test-go
          go test -race ./internal/browser ./internal/cage ./internal/environment ./internal/jobs ./internal/managedproxy ./internal/projects ./internal/settings ./internal/terminal ./internal/workbench
          go vet ./cmd/cage ./internal/browser ./internal/cage ./internal/environment ./internal/jobs ./internal/managedproxy ./internal/projects ./internal/privatefile ./internal/settings ./internal/terminal ./internal/workbench
      - name: Native application updater
        run: make test-app-updates
      - name: Patched networking and shared files
        run: |
          go test github.com/containers/gvisor-tap-vsock/pkg/services/dns github.com/lima-vm/lima/v2/pkg/hostagent/dns github.com/lima-vm/lima/v2/pkg/networks/usernet github.com/lima-vm/sshocker/pkg/reversesshfs
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict _output/Cage.app
          _output/Cage.app/Contents/Resources/cage --help
          _output/Cage.app/Contents/Resources/mihomo -v
      - uses: actions/upload-artifact@v4
        with:
          name: cage-development-build
          path: _output/Cage.app
          retention-days: 7
